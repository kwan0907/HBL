<style>
/* ===== 阻擋手機端下拉刷新 ===== */
html, body {
  overscroll-behavior-y: none;
}

/* ===== 全局變數：淺色模式 ===== */
:root {
  --bg-gradient: linear-gradient(-45deg, #f0f9ff, #e0f2fe, #bae6fd, #e0f2fe);
  --glass-bg: rgba(255, 255, 255, 0.85);
  --glass-bg-solid: rgba(240, 249, 255, 0.95);
  --glass-border: rgba(14, 165, 233, 0.25);
  --glass-shadow: 0 4px 20px 0 rgba(14, 165, 233, 0.08);
  --glass-item-bg: rgba(14, 165, 233, 0.08);
  --glass-item-hover: rgba(14, 165, 233, 0.15);
  
  --text-main: #1e293b;
  --text-muted: #64748b;
  --text-heading: #0f172a;
  
  --primary-color: #0ea5e9;
  --primary-hover: #0284c7;
  --danger-bg: rgba(239, 68, 68, 0.95);
  --danger-hover: #dc2626;
  --copy-bg: rgba(14, 165, 233, 0.95);
  --copy-hover: #0284c7;

  --clear-bg: rgba(239, 68, 68, 0.1);
  --clear-text: #ef4444;
  --clear-border: rgba(239, 68, 68, 0.4);
  --clear-hover-bg: rgba(239, 68, 68, 0.2);
  --clear-hover-text: #dc2626;
  
  --table-head-bg: rgba(240, 249, 255, 0.9);
  --table-border: rgba(14, 165, 233, 0.15);
  --table-row-even: rgba(240, 249, 255, 0.5);
  --table-row-hover: rgba(224, 242, 254, 0.8);
  
  --color-profit: #15803d;
  --color-profit-bg: rgba(220, 252, 231, 0.8);
  --color-profit-border: rgba(134, 239, 172, 0.8);
  --color-pkg: #8b5cf6;
  --color-pkg-bg: rgba(245, 243, 255, 0.85);
  --color-pkg-border: rgba(196, 181, 253, 0.8);

  --cart-item-bg: rgba(14, 165, 233, 0.08);
  --cart-item-border: rgba(56, 189, 248, 0.4);
  --cart-price-color: #0284c7;
  --cart-summary-bg: rgba(240, 249, 255, 0.92);
  
  --modal-overlay: rgba(15, 23, 42, 0.4);
  --modal-bg: rgba(248, 250, 252, 0.98);
  --input-bg: rgba(255, 255, 255, 0.6);
}

/* ===== 全局變數：深色模式 ===== */
@media (prefers-color-scheme: dark) {
  :root {
    --bg-gradient: linear-gradient(-45deg, #082f49, #0f172a, #0c4a6e, #1e293b);
    --glass-bg: rgba(15, 23, 42, 0.88);
    --glass-bg-solid: rgba(15, 23, 42, 0.98);
    --glass-border: rgba(56, 189, 248, 0.25);
    --glass-shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.5);
    --glass-item-bg: rgba(14, 165, 233, 0.12);
    --glass-item-hover: rgba(56, 189, 248, 0.2);
    
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --text-heading: #e0f2fe;
    
    --primary-color: #38bdf8;
    --primary-hover: #0ea5e9;
    --danger-bg: rgba(244, 63, 94, 0.95);
    --danger-hover: #e11d48;
    --copy-bg: rgba(14, 165, 233, 0.95);
    --copy-hover: #0284c7;

    --clear-bg: rgba(244, 63, 94, 0.15);
    --clear-text: #fb7185;
    --clear-border: rgba(244, 63, 94, 0.4);
    --clear-hover-bg: rgba(244, 63, 94, 0.25);
    --clear-hover-text: #f43f5e;
    
    --table-head-bg: rgba(15, 23, 42, 0.95);
    --table-border: rgba(56, 189, 248, 0.2);
    --table-row-even: rgba(14, 165, 233, 0.05);
    --table-row-hover: rgba(14, 165, 233, 0.15);
    
    --color-profit: #4ade80;
    --color-profit-bg: rgba(20, 83, 45, 0.6);
    --color-profit-border: rgba(74, 222, 128, 0.4);
    --color-pkg: #a78bfa;
    --color-pkg-bg: rgba(91, 33, 182, 0.4);
    --color-pkg-border: rgba(139, 92, 246, 0.4);

    --cart-item-bg: rgba(14, 165, 233, 0.12);
    --cart-item-border: rgba(56, 189, 248, 0.3);
    --cart-price-color: #7dd3fc;
    --cart-summary-bg: rgba(15, 23, 42, 0.92);
    
    --modal-overlay: rgba(0, 0, 0, 0.7);
    --modal-bg: rgba(15, 23, 42, 0.98);
    --input-bg: rgba(15, 23, 42, 0.6);
  }
}

* { box-sizing: border-box; }

body { 
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
  margin: 0; 
  padding: max(4px, env(safe-area-inset-top)) 4px 4px 4px; 
  font-size: 13px; 
  font-weight: 500;
  color: var(--text-main);
  background: var(--bg-gradient);
  background-size: 400% 400%;
  animation: gradientBG 15s ease infinite;
  min-height: 100vh;
}

.container { 
  max-width: 100%; 
  margin: 0 auto; 
  padding: 8px; 
  border-radius: 12px; 
  background: var(--glass-bg);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
}

h1 { color: var(--text-heading); text-align: center; margin-bottom: 6px; font-size: 1.25rem; font-weight: 800; margin-top: 4px; }
input, select { font-size: 15px !important; color: var(--text-main); font-weight: 600; padding: 6px 8px; border-radius: 8px; }
select option { background: var(--glass-bg-solid); color: var(--text-main); font-weight: 600;}

.controls { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
.tier-select, .actions { 
  padding: 8px; border-radius: 10px; width: 100%; 
  background: var(--glass-item-bg); border: 1px solid var(--glass-border);
}
.price-controls { display: flex; flex-direction: column; gap: 6px; }
.price-control { width: 100%; }
.price-control label { display: block; margin-bottom: 2px; font-weight: 700; font-size: 0.85rem; color: var(--primary-color); }

.font-ctrl-bar {
  display: flex; align-items: center; justify-content: flex-end;
  gap: 6px; margin-bottom: 6px; padding: 6px 10px;
  border-radius: 10px; background: var(--glass-item-bg); border: 1px solid var(--glass-border);
}
.font-ctrl-label { color: var(--primary-color); font-size: 0.8rem; white-space: nowrap; margin-right: 2px; flex: 1; font-weight: 700; }
.font-ctrl-btns { display: flex; align-items: center; gap: 4px; }
.font-ctrl-btn {
  padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 0.85rem; min-width: 38px;
  background: var(--glass-bg-solid); border: 1px solid var(--primary-color); color: var(--primary-color);
}
.font-ctrl-btn:hover  { background: var(--glass-item-hover); }
.font-ctrl-btn:active { transform: scale(0.95); }
.font-ctrl-btn:disabled { opacity: 0.4; cursor: default; border-color: var(--glass-border); }

#font-size-display {
  min-width: 34px; text-align: center; font-size: 0.8rem; color: var(--primary-color); font-weight: 800;
  background: var(--glass-bg-solid); border: 1px solid var(--primary-color); border-radius: 6px; padding: 3px 6px;
}

button {
  padding: 6px 10px; border-radius: 8px; border: 1px solid var(--glass-border);
  font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.2s ease;
  background: var(--glass-bg-solid); color: var(--text-main);
  backdrop-filter: blur(4px); outline: none; -webkit-tap-highlight-color: transparent;
}
button:not([class*="btn-"]):not([class*="package-plan-btn"]):hover { 
  background: var(--glass-item-hover); box-shadow: 0 2px 6px rgba(14,165,233,0.15); border-color: var(--primary-color); color: var(--primary-color);
}
button:active { transform: scale(0.98); }

select, input { border: 1px solid var(--glass-border); width: 100%; background: var(--input-bg); backdrop-filter: blur(4px); color: var(--text-main); outline: none; }
select:focus, input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 2px var(--primary-color); }
select {
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%230ea5e9' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
  background-repeat: no-repeat; background-position: right 8px center; background-size: 14px; padding-right: 28px;
}

.actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: space-between; }
.actions button { flex: 1; min-width: 80px; padding: 8px 5px; font-weight: 800; }

.btn-clear { background: var(--clear-bg); color: var(--clear-text); border: 1px solid var(--clear-border); font-weight: 800; }
.btn-clear:hover { background: var(--clear-hover-bg) !important; color: var(--clear-hover-text) !important; }
.btn-primary { background: var(--primary-color); color: white; border: none; }
.btn-primary:hover { background: var(--primary-hover) !important; color: white !important; }
.btn-danger { background: var(--danger-bg); color: white; border: none; }
.btn-danger:hover { background: var(--danger-hover) !important; color: white !important; }
.btn-copy { background: var(--copy-bg); color: white; border: none; }
.btn-copy:hover { background: var(--copy-hover) !important; color: white !important; }

.btn-add-product {
  width: 100%; padding: 10px; font-size: 0.95rem; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 6px; border: none;
  background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
  color: white; font-weight: 800; box-shadow: 0 4px 10px rgba(14, 165, 233, 0.3);
}
.btn-add-product:hover { background: linear-gradient(135deg, var(--primary-hover), #0369a1) !important; color: white !important; }

.package-plans-section { margin-bottom: 8px; padding: 8px 10px; border-radius: 10px; background: var(--color-pkg-bg); border: 1px solid var(--color-pkg-border); }
.package-plans-title { font-size: 0.85rem; font-weight: 800; color: var(--color-pkg); margin-bottom: 6px; }
.package-plans-grid  { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.package-plan-btn { padding: 6px 8px; background: rgba(139, 92, 246, 0.95); color: white; border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; text-align: left; display: flex; flex-direction: column; gap: 2px; font-weight: 600; }
.package-plan-btn:hover { background: rgba(109, 40, 217, 1) !important; color: white !important; }
.package-plan-btn:active { background: rgba(91, 33, 182, 1) !important; color: white !important; transform: scale(0.98); }

.plan-row1 { display: flex; justify-content: space-between; align-items: baseline; }
.plan-name  { font-size: 0.75rem; font-weight: 800; }
.plan-price { font-size: 0.85rem; font-weight: 800; color: #fef08a; }
.plan-row2  { display: flex; justify-content: space-between; align-items: center; }
.plan-vp    { font-size: 0.65rem; opacity: 0.9; }
.plan-profit{ font-size: 0.65rem; color: #bbf7d0; font-weight: 800; }

.category-tab { padding: 4px 10px; border-radius: 14px; font-size: 0.8rem; border: 1px solid transparent; background: var(--glass-bg-solid); color: var(--text-main); transition: all 0.2s; font-weight: 600; }
.category-tab.active { background: var(--glass-bg-solid); border-color: var(--primary-color); color: var(--primary-color); font-weight: 800; box-shadow: 0 2px 4px rgba(14,165,233,0.15); }

.view-toggle { display: flex; justify-content: center; margin: 6px 0 8px 0; }
.view-toggle button { margin: 0 3px; border-radius: 8px; background: var(--glass-item-bg); padding: 6px 10px; font-size: 0.85rem; font-weight: 700; border-color: var(--glass-border);}
.view-toggle button.active { background: var(--glass-bg-solid); border-color: var(--primary-color); color: var(--primary-color); font-weight: 800; box-shadow: 0 2px 6px rgba(14,165,233,0.2);}

.table-container { overflow-x: auto; margin-bottom: 8px; border-radius: 8px; border: 1px solid var(--glass-border); }
table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
th, td { border: 1px solid var(--table-border); padding: 8px 4px; text-align: left; }
th { background: var(--table-head-bg); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 10; font-weight: 800; color: var(--primary-color); }
tr:nth-child(even) { background: var(--table-row-even); }
tr:hover { background: var(--table-row-hover); }
td.product-name { min-width: 70px; max-width: 120px; font-size: 0.78rem; font-weight: 800; }
tr.package-row td:not(.product-name) { color: var(--color-pkg); font-weight: 700; }

.qty-control { display: flex; align-items: center; justify-content: center; }
.qty-btn { width: 22px; height: 24px; display: flex; align-items: center; justify-content: center; background: var(--glass-bg-solid); border: 1px solid var(--primary-color); border-radius: 6px; font-weight: 800; font-size: 14px; cursor: pointer; color: var(--primary-color); }
.qty-btn:active { transform: scale(0.9); }
.qty-input { width: 26px; height: 24px; text-align: center; border: 1px solid var(--glass-border); border-radius: 6px; background: var(--input-bg); margin: 0 2px; padding: 0; font-size: 13px !important; font-weight: 700;}

.product-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 10px; padding: 10px; margin-bottom: 8px; font-weight: 600;}
.card-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-weight: 800; font-size: 0.9rem; color: var(--text-heading); }
.card-price-row { display: flex; justify-content: space-between; margin-bottom: 4px; padding: 3px 0; border-bottom: 1px dashed var(--table-border); font-size: 0.8rem; }

/* 🛒 購物車視圖 */
.cart-container { display: none; }
.cart-scroll-area { padding-bottom: 110px; } 
.cart-item { background: var(--cart-item-bg); border: 1px solid var(--cart-item-border); border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: transform 0.2s; }
.cart-item-info { flex: 1; margin-right: 8px; }
.cart-item-name { font-weight: 800; color: var(--text-heading); font-size: 0.9rem; margin-bottom: 4px; line-height: 1.3; }
.cart-item-price { color: var(--cart-price-color); font-weight: 800; font-size: 0.85rem; }
.cart-item-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.cart-item-total { font-weight: 800; font-size: 0.95rem; color: var(--primary-color); }
.cart-qty-input { font-size: 15px !important; font-weight: 900; color: var(--primary-color); width: 34px; height: 26px; border: 2px solid var(--primary-color); background: var(--glass-bg-solid); }

/* 完美置底的購物車總計 */
.cart-summary { 
  position: fixed; 
  bottom: 0; 
  left: 0; 
  right: 0; 
  background: var(--cart-summary-bg); 
  border-top: 1px solid var(--cart-item-border); 
  border-radius: 20px 20px 0 0; 
  padding: 12px 16px max(12px, env(safe-area-inset-bottom)); 
  box-shadow: 0 -4px 20px rgba(14, 165, 233, 0.2); 
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
  z-index: 100;
}
@media (min-width: 768px) {
  .cart-summary { max-width: 1200px; margin: 0 auto; border-left: 1px solid var(--cart-item-border); border-right: 1px solid var(--cart-item-border); }
}
.cart-summary-top-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-muted); font-weight: 700; }
.cart-summary-val { color: var(--text-heading); font-weight: 900; margin-left: 4px; }
.cart-summary-bottom-row { display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed rgba(14, 165, 233, 0.3); padding-top: 10px; }
.cart-summary-total { font-weight: 900; font-size: 1.15rem; color: var(--cart-price-color); }
.btn-copy-cart {
  background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
  color: white; border: none; padding: 10px 16px; border-radius: 12px;
  font-weight: 800; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(14,165,233,0.3);
  cursor: pointer; margin: 0;
}
.btn-copy-cart:active { transform: scale(0.95); }

/* 總計區塊 */
.summary { background: var(--glass-item-bg); padding: 10px; border-radius: 10px; border: 1px solid var(--glass-border); }
.summary-item { flex: 1; min-width: 140px; margin-bottom: 6px; background: var(--glass-bg); padding: 8px; border-radius: 8px; border: 1px solid var(--glass-border); }
.summary-item h3 { margin-top: 0; color: var(--primary-color); font-size: 0.95rem; font-weight: 800; border-bottom: 1px solid var(--table-border); padding-bottom: 4px; margin-bottom: 6px; }
.summary-row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.85rem; font-weight: 600;}
.summary-row.total { font-weight: 800; font-size: 1rem; margin-top: 6px; padding-top: 4px; border-top: 1px dashed var(--table-border); color: var(--text-heading); }
.profit { color: var(--color-profit); font-weight: 800; }
.summary-item.profit-section { background: var(--color-profit-bg); border-color: var(--color-profit-border); }

/* Modal 彈窗與 Checkbox */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--modal-overlay); backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: center; }
.modal { background: var(--modal-bg); border: 1px solid var(--glass-border); border-radius: 16px; box-shadow: 0 10px 40px rgba(14,165,233,0.2); max-width: 90%; width: 320px; padding: 20px; backdrop-filter: blur(16px); }
.modal-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 12px; color: var(--primary-color); text-align: center;}
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.copy-opt-label { display: flex; align-items: center; padding: 10px 14px; margin-bottom: 8px; background: var(--glass-item-bg); border: 1px solid var(--glass-border); border-radius: 10px; cursor: pointer; color: var(--text-main); font-weight: 700; transition: background 0.2s; }
.copy-opt-label:hover { background: var(--glass-item-hover); border-color: var(--primary-color); }
.copy-opt-label input[type="checkbox"] { margin-right: 12px; width: 18px; height: 18px; accent-color: var(--primary-color); cursor: pointer; flex-shrink: 0; }

/* 完美恢復的搜尋添加 Modal */
.search-modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--modal-overlay); backdrop-filter: blur(8px); z-index: 800;
  align-items: flex-end; justify-content: center; padding: 0;
}
.search-modal-content {
  width: 100%; max-width: 600px; height: 86vh;
  background: var(--modal-bg); backdrop-filter: blur(16px);
  border-radius: 20px 20px 0 0; border: 1px solid var(--glass-border);
  box-shadow: 0 -8px 32px rgba(14,165,233,0.2); display: flex; flex-direction: column;
  animation: slideUpFromBottom 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}
.search-modal-handle { width: 40px; height: 4px; background: rgba(14,165,233,0.3); border-radius: 2px; margin: 10px auto 4px; flex-shrink: 0; }
.search-modal-bar { display: flex; gap: 6px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--glass-item-bg); border-top: 1px solid var(--glass-border); align-items: center; flex-shrink: 0; }
.search-modal-input-wrap { position: relative; flex: 1; }
.search-modal-input-wrap input { padding: 10px 34px 10px 12px; border-radius: 10px; font-size: 16px !important; width: 100%; }
#search-clear-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: rgba(14,165,233,0.15); width: 20px; height: 20px; border-radius: 50%; color: var(--primary-color); display: flex; align-items: center; justify-content: center; border: none; font-size: 10px; font-weight: 800; opacity: 0; pointer-events: none; transition: opacity 0.2s; margin: 0; }
#search-clear-btn.visible { opacity: 1; pointer-events: auto; }
.btn-search-close { background: var(--glass-bg-solid); border-radius: 8px; font-weight: 800; color: var(--primary-color); border: 1px solid var(--primary-color); margin: 0; white-space: nowrap; flex-shrink: 0;}
.search-modal-cats { display: flex; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 8px 10px 7px; gap: 6px; border-top: 1px solid var(--glass-border); background: var(--glass-item-bg); scrollbar-width: none; flex-shrink: 0; }
.search-modal-cats::-webkit-scrollbar { display: none; }
.product-list-modal { overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.product-list-modal::before { content: ''; flex: 1 1 0; }
.product-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--table-border); background: transparent; transition: background 0.15s; font-weight: 600; }
.product-item:hover { background: var(--table-row-hover); }
.product-item-inner { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.product-item-left  { flex: 1; min-width: 0; }

function triggerHaptic(type = 'light') {
  if (!navigator.vibrate) return;
  try {
    switch (type) {
      case 'light':   navigator.vibrate(10); break;
      case 'medium':  navigator.vibrate(20); break;
      case 'heavy':   navigator.vibrate(30); break;
      case 'success': navigator.vibrate([15, 50, 15]); break;
    }
  } catch(e) {}
}

const FONT_SIZES  = [11, 13, 16, 20];
const FONT_LABELS = ['小', '標準', '大', '特大'];
let currentFontLevel = 1;

function initFontSize() {
  try {
    const saved = localStorage.getItem('calcFontLevel');
    if (saved !== null) {
      const v = parseInt(saved);
      if (!isNaN(v) && v >= 0 && v < FONT_SIZES.length) currentFontLevel = v;
    }
  } catch(e) {}
  applyFontSize();
}

function changeFontSize(delta) {
  triggerHaptic('light');
  const next = currentFontLevel + delta;
  if (next < 0 || next >= FONT_SIZES.length) return;
  currentFontLevel = next;
  try { localStorage.setItem('calcFontLevel', currentFontLevel); } catch(e) {}
  applyFontSize();
  showToast('字體大小：' + FONT_LABELS[currentFontLevel]);
}

function applyFontSize() {
  document.body.style.fontSize = FONT_SIZES[currentFontLevel] + 'px';
  const disp = document.getElementById('font-size-display');
  if (disp) disp.textContent = FONT_LABELS[currentFontLevel];
  const decBtn = document.getElementById('font-decrease-btn');
  const incBtn = document.getElementById('font-increase-btn');
  if (decBtn) decBtn.disabled = (currentFontLevel === 0);
  if (incBtn) incBtn.disabled = (currentFontLevel === FONT_SIZES.length - 1);
}

let longPressTimer = null;
let longPressInterval = null;
function startIncrease(stockNo) { endLongPress(); triggerHaptic('light'); increaseQuantity(stockNo); longPressTimer = setTimeout(() => { longPressInterval = setInterval(() => {triggerHaptic('light'); increaseQuantity(stockNo);}, 90); }, 480); }
function startDecrease(stockNo) { endLongPress(); triggerHaptic('light'); decreaseQuantity(stockNo); longPressTimer = setTimeout(() => { longPressInterval = setInterval(() => {triggerHaptic('light'); decreaseQuantity(stockNo);}, 90); }, 480); }
function endLongPress() {
  if (longPressTimer)    { clearTimeout(longPressTimer);    longPressTimer = null; }
  if (longPressInterval) { clearInterval(longPressInterval); longPressInterval = null; }
}

function scrollListToTop() { document.getElementById('product-list').scrollTop = 0; }

function openSearchModal() {
  const overlay = document.getElementById('search-modal-overlay');
  overlay.style.display = 'flex';
  const content = overlay.querySelector('.search-modal-content');
  content.style.animation = 'none'; content.offsetHeight; content.style.animation = '';
  filterProducts(); scrollListToTop();
  setTimeout(() => { document.getElementById('product-search').focus(); }, 80);
}
function closeSearchModal() {
  document.getElementById('search-modal-overlay').style.display = 'none';
  document.getElementById('product-search').value = ''; updateClearBtn();
}
function handleOverlayClick(e) {
  if (e.target === document.getElementById('search-modal-overlay')) { triggerHaptic('light'); closeSearchModal(); }
}
function updateClearBtn() {
  const val = document.getElementById('product-search').value;
  document.getElementById('search-clear-btn').classList.toggle('visible', !!val);
}
function clearSearch() {
  document.getElementById('product-search').value = ''; updateClearBtn();
  filterProducts(); scrollListToTop(); document.getElementById('product-search').focus();
}

function formatPrice(price, isPackage) { return isPackage ? '$' + Math.round(price) : '$' + price.toFixed(2); }
function formatProfit(profit) {
  const rounded = Math.round(profit * 10) / 10;
  const intPart = Math.floor(rounded), decPart = Math.round((rounded - intPart) * 10);
  const intStr  = intPart.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return decPart > 0 ? '$' + intStr + '.' + decPart : '$' + intStr;
}

function copyToClipboard() {
  if (selectedProducts.length === 0) { triggerHaptic('medium'); showToast('沒有可複製的產品'); return; }
  triggerHaptic('light');
  
  const t1 = document.getElementById('pricing-tier1').value;
  const t2 = document.getElementById('pricing-tier2').value;
  const cmp = t2 && t1 !== t2;
  const hasPkgProfit = selectedProducts.some(p => p.type === 'package' && p.fixedProfit !== undefined);
  const hasProfit = cmp || hasPkgProfit;

  let modalHtml = `
    <div class="modal-overlay" id="copy-modal" style="display:flex; z-index: 2000;">
      <div class="modal">
        <div class="modal-title">📋 選擇複製資訊</div>
        <div class="modal-content">
          <label class="copy-opt-label">
            <input type="checkbox" id="copy-opt-unitprice" checked> 單價
          </label>
          <label class="copy-opt-label">
            <input type="checkbox" id="copy-opt-totalprice" checked> 總價
          </label>
          <label class="copy-opt-label">
            <input type="checkbox" id="copy-opt-vp" checked> VP 分數
          </label>
          <label class="copy-opt-label">
            <input type="checkbox" id="copy-opt-totalvp" checked> 總 VP 分數
          </label>
  `;

function executeCopy() {
  const includeUnitPrice  = document.getElementById('copy-opt-unitprice')  ? document.getElementById('copy-opt-unitprice').checked  : false;
  const includeTotalPrice = document.getElementById('copy-opt-totalprice') ? document.getElementById('copy-opt-totalprice').checked : false;
  const includeVP         = document.getElementById('copy-opt-vp')         ? document.getElementById('copy-opt-vp').checked         : false;
  const includeTotalVP    = document.getElementById('copy-opt-totalvp')    ? document.getElementById('copy-opt-totalvp').checked    : false;
  const includeProfit     = document.getElementById('copy-opt-profit')     ? document.getElementById('copy-opt-profit').checked     : false;

  const copyModal = document.getElementById('copy-modal');
  if (copyModal) copyModal.remove();

  const t1 = document.getElementById('pricing-tier1').value;
  const t2 = document.getElementById('pricing-tier2').value;
  const cmp = t2 && t1 !== t2;
  const now = new Date();
  const dateStr = now.toLocaleDateString('zh-HK') + ' ' + now.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' });
  let lines = ['📋 產品詳細計算', '日期：' + dateStr, '等級：' + t1 + (cmp ? ' / ' + t2 : ''), '================================', ''];

  selectedProducts.forEach((p, i) => {
    const isPkg = p.type === 'package';
    const price1 = p[t1], totalPrice1 = price1 * p.quantity, totalVP = p.vp * p.quantity;
    lines.push((i+1) + '. ' + p.prod_name + (isPkg ? '【套裝】' : '') + ' * ' + p.quantity);

    if (cmp) {
      const price2 = p[t2], totalPrice2 = price2 * p.quantity;
      let up, tp;
      if (isPkg && p.fixedProfit !== undefined) { up = p.fixedProfit; tp = up * p.quantity; }
      else { up = Math.abs(price2 - price1); tp = up * p.quantity; }

      let parts1 = [];
      if (includeUnitPrice)  parts1.push('單價：' + formatPrice(price1, isPkg));
      if (includeTotalPrice) parts1.push('總價：' + formatPrice(totalPrice1, isPkg));
      if (parts1.length) lines.push('   ' + t1 + ' ' + parts1.join('  '));

      let parts2 = [];
      if (includeUnitPrice)  parts2.push('單價：' + formatPrice(price2, isPkg));
      if (includeTotalPrice) parts2.push('總價：' + formatPrice(totalPrice2, isPkg));
      if (parts2.length) lines.push('   ' + t2 + ' ' + parts2.join('  '));

      if (includeProfit) {
        lines.push('   💰 利潤：' + formatProfit(up) + ' / 件 合計：' + formatProfit(tp));
      }
    } else {
      let parts = [];
      if (includeUnitPrice)  parts.push('單價：' + formatPrice(price1, isPkg));
      if (includeTotalPrice) parts.push('總價：' + formatPrice(totalPrice1, isPkg));
      if (parts.length) lines.push('   ' + parts.join('  '));

      if (includeProfit && isPkg && p.fixedProfit !== undefined) {
         lines.push('   💰 固定利潤：' + formatProfit(p.fixedProfit) + ' / 件 合計：' + formatProfit(p.fixedProfit * p.quantity));
      }
    }

    let vpParts = [];
    if (includeVP)      vpParts.push('VP：' + p.vp.toFixed(2));
    if (includeTotalVP) vpParts.push('總VP：' + totalVP.toFixed(2));
    if (vpParts.length) lines.push('   ' + vpParts.join('  '));

    lines.push('');
  });

  const totalQty = selectedProducts.reduce((s, p) => s + p.quantity, 0);
  const totalP1  = selectedProducts.reduce((s, p) => s + p[t1] * p.quantity, 0);
  const totalVP  = selectedProducts.reduce((s, p) => s + p.vp * p.quantity, 0);
  const pkgProds = selectedProducts.filter(p => p.type === 'package' && p.fixedProfit !== undefined);
  const totalPkgPr = pkgProds.reduce((s, p) => s + p.fixedProfit * p.quantity, 0);

  lines.push('================================', '📊 總計', '總數量：' + totalQty + ' 件');

  if (includeTotalPrice) {
    lines.push('總金額（' + t1 + '）：$' + totalP1.toFixed(2));
    if (cmp) {
      const totalP2 = selectedProducts.reduce((s, p) => s + p[t2] * p.quantity, 0);
      lines.push('總金額（' + t2 + '）：$' + totalP2.toFixed(2));
    }
  }

  if (includeProfit && cmp) {
    const totalPr = selectedProducts.reduce((s, p) => {
      if (p.type === 'package' && p.fixedProfit !== undefined) return s + p.fixedProfit * p.quantity;
      return s + Math.abs(p[t2] - p[t1]) * p.quantity;
    }, 0);
    lines.push('💰 總利潤：' + formatProfit(totalPr));
  }

  if (includeTotalVP) {
    lines.push('總VP：' + totalVP.toFixed(2));
  }

  if (includeProfit && pkgProds.length > 0) {
    lines.push('', '💰 套裝固定利潤');
    pkgProds.forEach(p => lines.push('  ' + p.prod_name + ' * ' + p.quantity + '：' + formatProfit(p.fixedProfit * p.quantity)));
    lines.push('  套裝利潤合計：' + formatProfit(totalPkgPr));
  }

  const text = lines.join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('✅ 全資料已複製！')).catch(() => fallbackCopy(text));
  } else { fallbackCopy(text); }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); showToast('✅ 成功複製！'); }
  catch (e) { showToast('複製失敗，請手動選取'); }
  document.body.removeChild(ta);
}

function copyCartSimple() {
  triggerHaptic('light');
  if (selectedProducts.length === 0) { showToast('購物車是空的'); return; }
  
  const t1 = document.getElementById('pricing-tier1').value;
  let lines = ['🛒 購物車清單', '===================='];
  let tQty = 0, tPrice = 0, tVP = 0;
  
  selectedProducts.forEach(p => {

    lines.push(`- ${p.prod_name}${isPkg ? ' (套裝)' : ''} * ${p.quantity}`);

  const text = lines.join('\n');

    navigator.clipboard.writeText(text).then(() => { triggerHaptic('success'); showToast('✅ 購物車已複製！'); }).catch(() => fallbackCopy(text));
  } else { fallbackCopy(text); }
}

function switchView(viewType) {
  triggerHaptic('light');
  currentView = viewType;
  
  document.getElementById('table-container').style.display = 'none';
  document.getElementById('product-cards').style.display = 'none';
  document.getElementById('cart-container').style.display = 'none';
  
  document.getElementById('table-view-btn').classList.remove('active');
  document.getElementById('card-view-btn').classList.remove('active');
  document.getElementById('cart-view-btn').classList.remove('active');
  
  if (viewType === 'table') {
    document.getElementById('table-container').style.display = 'block';
    document.getElementById('table-view-btn').classList.add('active');
  } else if (viewType === 'card') {

}

function initCategories() {
  const categories = ['all', ...new Set(productsData.map(p => p.category))];
  const tabsContainer = document.getElementById('category-tabs');
  categories.forEach(category => {
    const tab = document.createElement('div');
    tab.className = 'category-tab' + (category === 'all' ? ' active' : '');
    tab.textContent = category === 'all' ? '全部' : category;
    tab.onclick = () => {
      triggerHaptic('light');
      document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active'); currentCategory = category; filterProducts(); scrollListToTop();
    };
    tabsContainer.appendChild(tab);
  });
}

function filterProducts() {
  const searchText = document.getElementById('product-search').value.toLowerCase();
  const t1 = document.getElementById('pricing-tier1').value;
  const productList = document.getElementById('product-list');
  productList.innerHTML = '';
  const filtered = productsData.filter(p => {
    const matchSearch = !searchText ||
      p.stock_no.toLowerCase().includes(searchText) ||
      p.prod_name.toLowerCase().includes(searchText) ||
      p.prod_name_en.toLowerCase().includes(searchText);
    const matchCat = currentCategory === 'all' || p.category === currentCategory;
    return matchSearch && matchCat;
  });
  filtered.sort((a, b) => a.prod_seq - b.prod_seq);
  filtered.forEach(product => {
    const item = document.createElement('div');
    const isPkg = product.type === 'package';
    item.className = 'product-item' + (isPkg ? ' product-item-package' : '');
    const sel = selectedProducts.find(p => p.stock_no === product.stock_no);
    const badge = sel ? `<span class="selected-badge">✓ ${sel.quantity}</span>` : '';
    const price = isPkg ? '$' + Math.round(product[t1]) : '$' + product[t1].toFixed(2);
    item.innerHTML = `<div class="product-item-inner">
      <div class="product-item-left">${badge}<strong>${product.stock_no}</strong> - ${product.prod_name}${isPkg ? ` <span style="color:var(--color-pkg);font-size:0.78em;">[套裝]</span>` : ''}</div>
      <div class="product-item-price">${price}</div>
    </div>`;
    item.onclick = () => addProduct(product);
    productList.appendChild(item);
  });
  if (filtered.length === 0) {
    const el = document.createElement('div');
    el.className = 'product-item';
    el.style.color = 'var(--text-muted)'; el.style.fontStyle = 'italic'; el.style.textAlign = 'center';
    el.textContent = '沒有找到符合條件的產品';
    productList.appendChild(el);
  }
}

function addProduct(product) {
  triggerHaptic('medium');
  const existing = selectedProducts.find(p => p.stock_no === product.stock_no);
  if (existing) { existing.quantity += 1; showToast(`${product.prod_name} * ${existing.quantity}`); }
  else { selectedProducts.push({ ...product, quantity: 1 }); newlyAddedStockNos.add(product.stock_no); showToast(`已添加：${product.prod_name}`); }
  updateProductDisplay(); filterProducts();
  setTimeout(() => newlyAddedStockNos.clear(), 400);
}

function addBigMealCombo() {
  triggerHaptic('light');
  showConfirmDialog('確定要快捷添加「大餐四寶」到購物車嗎？', () => {
    triggerHaptic('success');
    const stockNos = ["0079", "0210", "0111", "0130"];
    let added = false;
    stockNos.forEach(stockNo => {
      const product = productsData.find(p => p.stock_no === stockNo);
      if (product) {
        const existing = selectedProducts.find(p => p.stock_no === stockNo);
        if (existing) { existing.quantity += 1; } 
        else { selectedProducts.push({ ...product, quantity: 1 }); newlyAddedStockNos.add(stockNo); }
        added = true;
      }
    });
    if (added) {
      updateProductDisplay(); 
      showToast('🍽️ 已成功添加：大餐四寶 (4件獨立產品)');
      setTimeout(() => newlyAddedStockNos.clear(), 400);
    }
  });
}

function addPackagePlan(stockNo) {
  triggerHaptic('medium');
  const plan = productsData.find(p => p.stock_no === stockNo);
  if (!plan) return;
  const existing = selectedProducts.find(p => p.stock_no === stockNo);
  if (existing) { existing.quantity += 1; } else { selectedProducts.push({ ...plan, quantity: 1 }); newlyAddedStockNos.add(stockNo); }
  updateProductDisplay();
  setTimeout(() => newlyAddedStockNos.clear(), 400);
  showToast(`已添加：${plan.prod_name}`);
}

function removeProductWithAnimation(stockNo) {
  triggerHaptic('medium');
  const els = document.querySelectorAll(`[data-stockno="${stockNo}"]`);
  if (els.length > 0) { els.forEach(el => el.classList.add('removing')); setTimeout(() => removeProduct(stockNo), 200); }
  else { removeProduct(stockNo); }
}
function removeProduct(stockNo) { selectedProducts = selectedProducts.filter(p => p.stock_no !== stockNo); updateProductDisplay(); }
function updateQuantity(stockNo, newQty) { triggerHaptic('light'); const p = selectedProducts.find(p => p.stock_no === stockNo); if (p) { p.quantity = Math.max(1, newQty); updateProductDisplay(); } }
function increaseQuantity(stockNo) { const p = selectedProducts.find(p => p.stock_no === stockNo); if (p) { p.quantity += 1; updateProductDisplay(); } }
function decreaseQuantity(stockNo) { const p = selectedProducts.find(p => p.stock_no === stockNo); if (p && p.quantity > 1) { p.quantity -= 1; updateProductDisplay(); } }

function updateProductDisplay() { 
  updateTableHeader(); 
  if (currentView === 'table') updateProductTable();

}

function qtyBtnHTML(action, stockNo, label) {

function updateProductTable() {

  const t1 = document.getElementById('pricing-tier1').value;
  const t2 = document.getElementById('pricing-tier2').value;
  const cmp = t2 && t1 !== t2;

  const showProfitCols = cmp || hasPkgProfit;
  const colCount = 6 + (cmp ? 4 : 2) + (showProfitCols ? 2 : 0);

  if (selectedProducts.length === 0) {
    tbody.innerHTML = `<tr><td colspan="${colCount}" style="text-align:center; padding:20px; color:var(--text-muted);">尚未選擇任何產品</td></tr>`;
    return;
  }
  selectedProducts.forEach(product => {

    row.setAttribute('data-stockno', product.stock_no);

    let html = `<td>${product.stock_no}</td>

    if (cmp) {
      const p2 = product[t2], tp2 = p2 * product.quantity;
      let up, tpr;
      if (isPkg && product.fixedProfit !== undefined) { up = product.fixedProfit; tpr = up * product.quantity; }
      else { up = Math.abs(p2 - p1); tpr = up * product.quantity; }
      html += `<td>${formatPrice(p1,isPkg)}</td><td>${formatPrice(tp1,isPkg)}</td><td>${formatPrice(p2,isPkg)}</td><td>${formatPrice(tp2,isPkg)}</td>`;

        <div class="card-price-row"><div>${t2} 總價 (* ${product.quantity}):</div><div>${formatPrice(tp2,false)}</div></div>
        <div class="card-price-row"><div>總利潤:</div><div class="profit">${formatProfit(tpr)}</div></div>`;
    } else {
      html += `<div class="card-price-row"><div>${t1} 單價:</div><div>${formatPrice(p1,false)}</div></div>
        <div class="card-price-row"><div>${t1} 總價 (* ${product.quantity}):</div><div>${formatPrice(tp1,false)}</div></div>`;
    }
    html += `<div class="card-price-row"><div>VP:</div><div>${product.vp.toFixed(2)}</div></div>
      <div class="card-price-row"><div>總VP:</div><div>${tvp.toFixed(2)}</div></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">
        <div class="qty-control">
          ${qtyBtnHTML('dec', product.stock_no, '−')}
          <input type="number" class="qty-input" value="${product.quantity}" min="1" onchange="updateQuantity('${product.stock_no}', parseInt(this.value))">
          ${qtyBtnHTML('inc', product.stock_no, '+')}
        </div>
        <button class="btn-danger" style="padding:6px 12px;font-size:0.85rem;" onclick="removeProductWithAnimation('${product.stock_no}')">移除</button>
      </div>`;
    card.innerHTML = html; cc.appendChild(card);
  });
}

function updateCartView() {
  const cc = document.getElementById('cart-view-content');
  const t1 = document.getElementById('pricing-tier1').value;
  cc.innerHTML = '';
  
  if (selectedProducts.length === 0) {
    cc.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-style:italic;">🛒 購物車是空的</div>';
    document.getElementById('cart-summary-section').style.display = 'none';
    return;
  }
  
  document.getElementById('cart-summary-section').style.display = 'block';
  
  let totalQty = 0;
  let totalPrice = 0;
  let totalVP = 0;

  selectedProducts.forEach(product => {
    const isPkg = product.type === 'package';
    const price = product[t1];
    const tp = price * product.quantity;
    
    totalQty += product.quantity;
    totalPrice += tp;
    totalVP += product.vp * product.quantity;

    const item = document.createElement('div');
    item.className = ['cart-item', newlyAddedStockNos.has(product.stock_no) ? 'animate-in' : ''].filter(Boolean).join(' ');
    item.setAttribute('data-stockno', product.stock_no);
    
    item.innerHTML = `
      <div class="cart-item-info">
        <div class="cart-item-name">${product.prod_name}${isPkg ? ' <span style="font-size:0.8em;color:var(--color-pkg);">(套裝)</span>' : ''}</div>
        <div class="cart-item-price">${formatPrice(price, isPkg)} / 件</div>
      </div>
      <div class="cart-item-actions">
        <div class="cart-item-total">計: ${formatPrice(tp, isPkg)}</div>
        <div class="qty-control">
          ${qtyBtnHTML('dec', product.stock_no, '−')}
          <input type="number" class="qty-input cart-qty-input" value="${product.quantity}" min="1" onchange="updateQuantity('${product.stock_no}', parseInt(this.value))">
          ${qtyBtnHTML('inc', product.stock_no, '+')}
        </div>
      </div>
    `;
    cc.appendChild(item);
  });

  document.getElementById('cart-total-qty').textContent = totalQty;
  document.getElementById('cart-total-vp').textContent = totalVP.toFixed(2);
  document.getElementById('cart-total-price').textContent = '$' + totalPrice.toFixed(2);
}

function updatePricing() { updateProductDisplay(); }

function updateSummary() {
  const sc = document.getElementById('summary');
  if (currentView === 'cart') { sc.style.display = 'none'; return; } 
  sc.style.display = 'block';

  const t1 = document.getElementById('pricing-tier1').value;
  const t2 = document.getElementById('pricing-tier2').value;
  const cmp = t2 && t1 !== t2;
  const totalQty   = selectedProducts.reduce((s, p) => s + p.quantity, 0);
  const totalP1    = selectedProducts.reduce((s, p) => s + p[t1] * p.quantity, 0);
  const totalVP    = selectedProducts.reduce((s, p) => s + p.vp * p.quantity, 0);
  const pkgProds   = selectedProducts.filter(p => p.type === 'package' && p.fixedProfit !== undefined);
  const totalPkgPr = pkgProds.reduce((s, p) => s + p.fixedProfit * p.quantity, 0);
  let html = '<div style="display:flex;flex-wrap:wrap;gap:12px;">';
  if (cmp) {
    const totalP2 = selectedProducts.reduce((s, p) => s + p[t2] * p.quantity, 0);
    const totalPr = selectedProducts.reduce((s, p) => {
      if (p.type === 'package' && p.fixedProfit !== undefined) return s + p.fixedProfit * p.quantity;
      return s + Math.abs(p[t2] - p[t1]) * p.quantity;
    }, 0);
    const prRate = totalP1 > 0 ? (totalPr / totalP1) * 100 : 0;
    html += `<div class="summary-item"><h3>${t1} 價格</h3>
      <div class="summary-row"><div>總數量:</div><div>${totalQty}</div></div>
      <div class="summary-row total"><div>總金額:</div><div>$${totalP1.toFixed(2)}</div></div></div>
      <div class="summary-item"><h3>${t2} 價格</h3>
      <div class="summary-row"><div>總數量:</div><div>${totalQty}</div></div>
      <div class="summary-row total"><div>總金額:</div><div>$${totalP2.toFixed(2)}</div></div></div>
      <div class="summary-item"><h3>利潤計算</h3>
      <div class="summary-row"><div>總利潤:</div><div class="profit">${formatProfit(totalPr)}</div></div>
      <div class="summary-row"><div>利潤率:</div><div class="profit">${prRate.toFixed(2)}%</div></div>
      <div class="summary-row"><div>平均單件:</div><div class="profit">${totalQty > 0 ? formatProfit(totalPr / totalQty) : '$0'}</div></div></div>`;
    if (pkgProds.length > 0) {
      html += `<div class="summary-item profit-section"><h3>💰 套裝固定利潤</h3>`;
      pkgProds.forEach(p => { html += `<div class="summary-row"><div>${p.prod_name}(* ${p.quantity}):</div><div class="profit">${formatProfit(p.fixedProfit * p.quantity)}</div></div>`; });
      html += `<div class="summary-row total"><div>套裝利潤合計:</div><div class="profit">${formatProfit(totalPkgPr)}</div></div></div>`;
    }
  } else {
    html += `<div class="summary-item"><h3>${t1} 總計</h3>
      <div class="summary-row"><div>總數量:</div><div>${totalQty}</div></div>
      <div class="summary-row total"><div>總金額:</div><div>$${totalP1.toFixed(2)}</div></div></div>`;
    if (pkgProds.length > 0) {
      html += `<div class="summary-item profit-section"><h3>💰 套裝固定利潤</h3>`;
      pkgProds.forEach(p => { html += `<div class="summary-row"><div>${p.prod_name}(* ${p.quantity}):</div><div class="profit">${formatProfit(p.fixedProfit * p.quantity)}</div></div>`; });
      html += `<div class="summary-row total"><div>套裝利潤合計:</div><div class="profit">${formatProfit(totalPkgPr)}</div></div></div>`;
    }
  }
  html += `<div class="summary-item"><h3>VP計算</h3>
    <div class="summary-row"><div>總VP:</div><div>${totalVP.toFixed(2)}</div></div>
    <div class="summary-row"><div>平均VP:</div><div>${totalQty > 0 ? (totalVP / totalQty).toFixed(2) : '0.00'}</div></div></div>`;
  html += '</div>';
  sc.innerHTML = html;
}

function confirmClearSelection() {
  if (selectedProducts.length === 0) { triggerHaptic('medium'); showToast('沒有可清空的產品'); return; }
  triggerHaptic('light');
  showConfirmDialog('確定要清空所有已選產品嗎?', () => clearSelection());
}
function showConfirmDialog(message, callback) {
  document.getElementById('confirm-message').textContent = message;
  document.getElementById('confirm-action-btn').onclick = () => { triggerHaptic('light'); hideConfirmDialog(); if (typeof callback === 'function') callback(); };
  document.getElementById('confirm-modal').style.display = 'flex';
}
function hideConfirmDialog() { document.getElementById('confirm-modal').style.display = 'none'; }
function showToast(message, duration = 2500) {
  const t = document.getElementById('toast-message');
  t.textContent = message; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}
function clearSelection() { triggerHaptic('success'); selectedProducts = []; updateProductDisplay(); showToast('已清空所有選擇的產品'); }

let deferredInstallPrompt = null;
function initPWA() {
  if ('serviceWorker' in navigator) {
    const swCode = 'self.addEventListener("install",function(){self.skipWaiting();});self.addEventListener("activate",function(){self.clients.claim();});self.addEventListener("fetch",function(e){e.respondWith(caches.match(e.request).then(function(r){return r||fetch(e.request).catch(function(){return new Response("",{status:503});});}));});';
    try {
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], { type: 'application/javascript' })))
        .then(() => console.log('✅ PWA ServiceWorker 已啟用')).catch(() => {});
    } catch (e) {}
  }
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); deferredInstallPrompt = e; showPwaInstallBtn();
  });
  window.addEventListener('appinstalled', () => {
    hidePwaInstallBtn(); showToast('✅ App 已成功安裝到主畫面！');
  });
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (!isStandalone) setTimeout(showPwaInstallBtn, 600);
}
function showPwaInstallBtn() { var w = document.getElementById('pwa-install-wrap'); if (w) w.style.display = 'block'; }
function hidePwaInstallBtn() { var w = document.getElementById('pwa-install-wrap'); if (w) w.style.display = 'none'; }

function handlePwaInstall() {
  triggerHaptic('medium');
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then(function(r) { deferredInstallPrompt = null; if (r.outcome === 'accepted') hidePwaInstallBtn(); });
    return;
  }
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var isAndroid = /Android/.test(navigator.userAgent);
  var msg;
  if (isIOS) {
    msg = 'iPhone / iPad 安裝步驟：\n\n① 確認使用 Safari 瀏覽器打開\n\n② 點底部的「分享」按鈕\n   （方框加箭頭的圖示 □↑）\n\n③ 向下滑動，找到\n   「加入主畫面」\n\n④ 點右上角「新增」即完成 ✅';
  } else if (isAndroid) {
    msg = 'Android 安裝步驟：\n\n① 確認使用 Chrome 瀏覽器打開\n\n② 點右上角「⋮」選單\n\n③ 選「安裝應用程式」\n   或「新增至主畫面」\n\n④ 點「安裝」即完成 ✅';
  } else {
    msg = '安裝步驟：\n\n在瀏覽器網址列右側\n或「⋮」選單中\n找到「安裝應用程式」\n點擊後即可安裝到桌面 ✅';
  }
  document.getElementById('pwa-info-content').textContent = msg;
  document.getElementById('pwa-info-modal').style.display = 'flex';
}

function closeNewProductModal() {
  document.getElementById('new-product-modal').style.display = 'none';
}

function checkNewProductNotification() {
  if (!localStorage.getItem('seen_new_product_liver_fixed')) {
    document.getElementById('new-product-modal').style.display = 'flex';
    localStorage.setItem('seen_new_product_liver_fixed', 'true');
  }
}

window.onload = function () {
  initPWA();
  initFontSize();
  initCategories();
  switchView('table');
  updateProductDisplay();
  checkNewProductNotification();
  
  document.addEventListener('touchend', function (e) {
    const btn = e.target.closest('button');
    if (btn) setTimeout(() => btn.blur(), 50);
  }, { passive: true });
};
</script>
