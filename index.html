* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: max(4px, env(safe-area-inset-top)) 4px 4px 4px; font-size: 13px; font-weight: 500; color: var(--text-main); background: var(--bg-gradient); background-attachment: fixed; min-height: 100vh; }
.container { max-width: 100%; margin: 0 auto; padding: 8px; border-radius: 12px; background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); }
h1 { color: var(--text-heading); text-align: center; margin-bottom: 6px; font-size: 1.25rem; font-weight: 800; margin-top: 4px; letter-spacing: -0.5px; }

select option { background: var(--glass-bg-solid); color: var(--text-main); font-weight: 600;}
.controls { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
.tier-select, .actions { padding: 8px; border-radius: 10px; width: 100%; background: var(--glass-item-bg); border: 1px solid var(--glass-border); }
.price-controls { display: flex; flex-direction: column; gap: 6px; }
.price-control { width: 100%; }
.price-control label { display: block; margin-bottom: 2px; font-weight: 700; font-size: 0.85rem; color: var(--primary-color); }
.font-ctrl-bar { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; padding: 6px 10px; border-radius: 10px; background: var(--glass-item-bg); border: 1px solid var(--glass-border); }
.font-ctrl-label { color: var(--primary-color); font-size: 0.8rem; white-space: nowrap; flex: 1; font-weight: 700; }

.font-ctrl-btn:hover  { background: var(--glass-item-hover); }

.font-ctrl-btn.active { background: var(--primary-color); color: white; }

button { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--glass-border); font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; background: var(--glass-bg-solid); color: var(--text-main); backdrop-filter: blur(4px); outline: none; -webkit-tap-highlight-color: transparent; }

button:active { transform: scale(0.98); }

.btn-candidate { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; background: var(--glass-item-bg); color: var(--text-muted); border: 1px solid var(--glass-border); }

.cart-summary { position: fixed; bottom: 0; left: 0; right: 0; background: var(--cart-summary-bg); border-top: 1px solid var(--glass-border); border-radius: 20px 20px 0 0; padding: 12px 16px max(12px, env(safe-area-inset-bottom)); box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 100; }

const countryState = {
  HK: { selected: [], tier1: '標準價', tier2: '', includeFreight: false },
  TW: { selected: [], tier1: '建議零售價', tier2: '', includeFreight: false }
};

let currentCountry = 'HK';
let productsData = JSON.parse(JSON.stringify(hongKongProductsData));
let originalProductsData = JSON.parse(JSON.stringify(productsData));
let includeFreight = false;

function getCountryConfig() { return COUNTRY_CONFIGS[currentCountry]; }

function hydrateCountryProducts(country) {
  const source = country === 'TW' ? taiwanProductsData : hongKongProductsData;
  productsData = JSON.parse(JSON.stringify(source));
  originalProductsData = JSON.parse(JSON.stringify(productsData));
}

function updateTierSelectors() {
  const config = getCountryConfig();
  const tier1 = document.getElementById('pricing-tier1');
  const tier2 = document.getElementById('pricing-tier2');
  const state = countryState[currentCountry];
  tier1.innerHTML = config.tiers.map(([value, label]) => `<option value="${value}">${label}</option>`).join('');
  tier2.innerHTML = '<option value="">不使用</option>' + config.tiers.map(([value, label]) => `<option value="${value}">${label}</option>`).join('');
  tier1.value = config.tiers.some(([value]) => value === state.tier1) ? state.tier1 : config.defaultTier;
  tier2.value = config.tiers.some(([value]) => value === state.tier2) ? state.tier2 : '';
}

function saveCurrentCountryState() {
  const state = countryState[currentCountry];
  state.selected = selectedProducts.map(p => ({ stock_no: p.stock_no, quantity: p.quantity }));
  state.tier1 = document.getElementById('pricing-tier1').value;
  state.tier2 = document.getElementById('pricing-tier2').value;
  state.includeFreight = includeFreight;
  saveCandidates();
}

function restoreCountrySelection() {
  selectedProducts = countryState[currentCountry].selected.map(item => {
    const product = productsData.find(p => p.stock_no === item.stock_no);
    return product ? { ...product, quantity: item.quantity } : null;
  }).filter(Boolean);
}

function refreshCountryUi() {
  const config = getCountryConfig();
  document.getElementById('country-hk').classList.toggle('active', currentCountry === 'HK');
  document.getElementById('country-tw').classList.toggle('active', currentCountry === 'TW');
  document.getElementById('app-title').lastChild.textContent = `HBL ${config.name}產品計算器`;
  document.title = `HBL ${config.name}產品計算器`;
  document.getElementById('freight-control').style.display = currentCountry === 'HK' ? 'flex' : 'none';
  document.getElementById('hk-package-plans').style.display = currentCountry === 'HK' ? 'block' : 'none';
  document.getElementById('hk-big-meal-shortcut').style.display = currentCountry === 'HK' ? 'block' : 'none';
  updateTierSelectors();
}

function switchCountry(country, announce = true) {
  if (!COUNTRY_CONFIGS[country] || country === currentCountry) return;
  saveCurrentCountryState();
  currentCountry = country;
  try { localStorage.setItem('calcCountry', currentCountry); } catch(e) {}
  hydrateCountryProducts(currentCountry);
  includeFreight = currentCountry === 'HK' ? countryState.HK.includeFreight : false;
  restoreCountrySelection();
  candidateStockNos = new Set();
  loadCandidates();
  refreshCountryUi();
  if (currentCountry === 'HK' && includeFreight) toggleFreight(true, false);
  else updateFreightButtons(false);
  initCategories();
  updateProductDisplay();
  filterProducts();
  if (announce) showToast(`已切換至${getCountryConfig().flag} ${getCountryConfig().name}產品及價格`);
}

function initCountry() {
  let saved = 'HK';
  try { saved = localStorage.getItem('calcCountry') || 'HK'; } catch(e) {}
  if (!COUNTRY_CONFIGS[saved]) saved = 'HK';
  currentCountry = saved;
  hydrateCountryProducts(currentCountry);
  includeFreight = currentCountry === 'HK' ? countryState.HK.includeFreight : false;
  refreshCountryUi();
  updateFreightButtons(includeFreight);
}


// 保存原始數據的深拷貝，用於切換運費版本

function updateFreightButtons(val) {
  document.getElementById('freight-normal').classList.toggle('active', !val);
  document.getElementById('freight-included').classList.toggle('active', val);
}

function toggleFreight(val, announce = true) {
  if (currentCountry !== 'HK') return;
  includeFreight = val;
  countryState.HK.includeFreight = val;
  updateFreightButtons(val);
  if (announce) triggerHaptic('light');

  // 固定不加價的產品編號列表
  const noFreightStockNos = ['PKG1', 'PKG2', 'PKG3', 'PKG4', 'BO1L', 'I839', 'H258', 'H260', 'H262', '8601', '8602', '5122', 'DC30', 'X001', 'DC40', '9909', 'DC60'];
  const tiers = ['銅級', '銀級', '金級', '58%', '50%'];

  // 同步更新 productsData 和 selectedProducts
  [productsData, selectedProducts].forEach(list => {
    list.forEach(p => {
      if (noFreightStockNos.includes(p.stock_no) || p.type === 'package') return;
      tiers.forEach(tier => {
        const originalProduct = originalProductsData.find(op => op.stock_no === p.stock_no);
        if (!originalProduct) return;
        const origPrice = originalProduct[tier];
        if (includeFreight) {
          // 含運費版本規律：原價 + 標準價 * 3%，並四捨五入
          p[tier] = Math.round(origPrice + p['標準價'] * 0.03);
        } else {
          // 恢復正常價
          p[tier] = origPrice;
        }
      });
    });
  });

  updatePricing();
  filterProducts();
  if (announce) showToast(val ? '已切換為含運費價格 (+3%)' : '已切換為正常價格');
}

let selectedProducts = [];
let currentCategory = "all";
let currentView = "table";
let newlyAddedStockNos = new Set();
let candidateStockNos = new Set();
let currentStrategy = "accurate";
let vpWorker = null;

function triggerHaptic(type = 'light') { if (!navigator.vibrate) return; try { switch (type) { case 'light': navigator.vibrate(10); break; case 'medium': navigator.vibrate(20); break; case 'heavy': navigator.vibrate(30); break; case 'success': navigator.vibrate([15, 50, 15]); break; } } catch(e) {} }

const FONT_SIZES  = [11, 13, 16, 20];
const FONT_LABELS = ['小', '標準', '大', '特大'];
let currentFontLevel = 1;

function initFontSize() { try { const saved = localStorage.getItem('calcFontLevel'); if (saved !== null) { const v = parseInt(saved); if (!isNaN(v) && v >= 0 && v < FONT_SIZES.length) currentFontLevel = v; } } catch(e) {} applyFontSize(); }
function changeFontSize(delta) { triggerHaptic('light'); const next = currentFontLevel + delta; if (next < 0 || next >= FONT_SIZES.length) return; currentFontLevel = next; try { localStorage.setItem('calcFontLevel', currentFontLevel); } catch(e) {} applyFontSize(); showToast('字體大小：' + FONT_LABELS[currentFontLevel]); }

function formatPrice(price, isPackage) { const config = getCountryConfig(); const value = Number(price) || 0; const decimals = isPackage && currentCountry === 'HK' ? 0 : config.decimals; return config.currency + value.toLocaleString(config.locale, { minimumFractionDigits: decimals, maximumFractionDigits: decimals }); }

// 新增：取得日/次成本 HTML 字串的函數
function getCostHtml(price, days, servings) {
  if (!days || !servings) return '';
  const dCost = (price / days).toFixed(1);
  const sCost = (price / servings).toFixed(1);
  if (days === servings) {
    return `<div style="font-size:0.75em;color:var(--text-muted);margin-top:2px;font-weight:600;">日/次:${getCountryConfig().currency}${dCost}</div>`;
  }
  return `<div style="font-size:0.75em;color:var(--text-muted);margin-top:2px;font-weight:600;">日:${getCountryConfig().currency}${dCost} | 次:${getCountryConfig().currency}${sCost}</div>`;
}

// 新增：取得複製專用的成本字串
const getCopyCostStr = (price, days, servings) => {
  if (!days || !servings) return '';
  const d = (price / days).toFixed(1);
  const s = (price / servings).toFixed(1);
  return days === servings ? ` (日/次:${getCountryConfig().currency}${d})` : ` (日:${getCountryConfig().currency}${d}/次:${getCountryConfig().currency}${s})`;
};

function executeCopy() { const includeUnitPrice = document.getElementById('copy-opt-unitprice') ? document.getElementById('copy-opt-unitprice').checked : false; const includeTotalPrice = document.getElementById('copy-opt-totalprice') ? document.getElementById('copy-opt-totalprice').checked : false; const includeVP = document.getElementById('copy-opt-vp') ? document.getElementById('copy-opt-vp').checked : false; const includeTotalVP = document.getElementById('copy-opt-totalvp') ? document.getElementById('copy-opt-totalvp').checked : false; const includeProfit = document.getElementById('copy-opt-profit') ? document.getElementById('copy-opt-profit').checked : false; const copyModal = document.getElementById('copy-modal'); if (copyModal) copyModal.remove(); const t1 = document.getElementById('pricing-tier1').value; const t2 = document.getElementById('pricing-tier2').value; const cmp = t2 && t1 !== t2; const now = new Date(); const locale = getCountryConfig().locale; const dateStr = now.toLocaleDateString(locale) + ' ' + now.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' }); let lines = ['📋 產品詳細計算', '國家／地區：' + getCountryConfig().flag + ' ' + getCountryConfig().name, '日期：' + dateStr, '等級：' + t1 + (cmp ? ' / ' + t2 : ''), '================================', '']; selectedProducts.forEach((p, i) => { const isPkg = p.type === 'package'; const price1 = p[t1], totalPrice1 = price1 * p.quantity, totalVP = p.vp * p.quantity; lines.push((i+1) + '. ' + p.prod_name + (isPkg ? '【套裝】' : '') + ' * ' + p.quantity); if (cmp) { const price2 = p[t2], totalPrice2 = price2 * p.quantity; let up, tp; if (isPkg && p.fixedProfit !== undefined) { up = p.fixedProfit; tp = up * p.quantity; } else { up = Math.abs(price2 - price1); tp = up * p.quantity; } let parts1 = []; if (includeUnitPrice) parts1.push('單價：' + formatPrice(price1, isPkg) + getCopyCostStr(price1, p.days, p.servings)); if (includeTotalPrice) parts1.push('總價：' + formatPrice(totalPrice1, isPkg)); if (parts1.length) lines.push('   ' + t1 + ' ' + parts1.join('  ')); let parts2 = []; if (includeUnitPrice) parts2.push('單價：' + formatPrice(price2, isPkg) + getCopyCostStr(price2, p.days, p.servings)); if (includeTotalPrice) parts2.push('總價：' + formatPrice(totalPrice2, isPkg)); if (parts2.length) lines.push('   ' + t2 + ' ' + parts2.join('  ')); if (includeProfit) { lines.push('   💰 利潤：' + formatProfit(up) + ' / 件 合計：' + formatProfit(tp)); } } else { let parts = []; if (includeUnitPrice) parts.push('單價：' + formatPrice(price1, isPkg) + getCopyCostStr(price1, p.days, p.servings)); if (includeTotalPrice) parts.push('總價：' + formatPrice(totalPrice1, isPkg)); if (parts.length) lines.push('   ' + parts.join('  ')); if (includeProfit && isPkg && p.fixedProfit !== undefined) { lines.push('   💰 固定利潤：' + formatProfit(p.fixedProfit) + ' / 件 合計：' + formatProfit(p.fixedProfit * p.quantity)); } } let vpParts = []; if (includeVP) vpParts.push('VP：' + p.vp.toFixed(2)); if (includeTotalVP) vpParts.push('總VP：' + totalVP.toFixed(2)); if (vpParts.length) lines.push('   ' + vpParts.join('  ')); lines.push(''); }); const totalQty = selectedProducts.reduce((s, p) => s + p.quantity, 0); const totalP1 = selectedProducts.reduce((s, p) => s + p[t1] * p.quantity, 0); const totalVP = selectedProducts.reduce((s, p) => s + p.vp * p.quantity, 0); const pkgProds = selectedProducts.filter(p => p.type === 'package' && p.fixedProfit !== undefined); const totalPkgPr = pkgProds.reduce((s, p) => s + p.fixedProfit * p.quantity, 0); lines.push('================================', '📊 總計', '總數量：' + totalQty + ' 件'); if (includeTotalPrice) { lines.push('總金額（' + t1 + '）：' + formatPrice(totalP1, false)); if (cmp) { const totalP2 = selectedProducts.reduce((s, p) => s + p[t2] * p.quantity, 0); lines.push('總金額（' + t2 + '）：' + formatPrice(totalP2, false)); } } if (includeProfit && cmp) { const totalPr = selectedProducts.reduce((s, p) => { if (p.type === 'package' && p.fixedProfit !== undefined) return s + p.fixedProfit * p.quantity; return s + Math.abs(p[t2] - p[t1]) * p.quantity; }, 0); lines.push('💰 總利潤：' + formatProfit(totalPr)); } if (includeTotalVP) { lines.push('總VP：' + totalVP.toFixed(2)); } if (includeProfit && pkgProds.length > 0) { lines.push('', '💰 套裝固定利潤'); pkgProds.forEach(p => lines.push('  ' + p.prod_name + ' * ' + p.quantity + '：' + formatProfit(p.fixedProfit * p.quantity))); lines.push('  套裝利潤合計：' + formatProfit(totalPkgPr)); } const text = lines.join('\n'); if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(() => showToast('✅ 全資料已複製！')).catch(() => fallbackCopy(text)); } else { fallbackCopy(text); } }

function updateSummary() { const sc = document.getElementById('summary'); if (currentView === 'cart') { sc.style.display = 'none'; return; } sc.style.display = 'block'; const t1 = document.getElementById('pricing-tier1').value; const t2 = document.getElementById('pricing-tier2').value; const cmp = t2 && t1 !== t2; const totalQty = selectedProducts.reduce((s, p) => s + p.quantity, 0); const totalP1 = selectedProducts.reduce((s, p) => s + p[t1] * p.quantity, 0); const totalVP = selectedProducts.reduce((s, p) => s + p.vp * p.quantity, 0); const pkgProds = selectedProducts.filter(p => p.type === 'package' && p.fixedProfit !== undefined); const totalPkgPr = pkgProds.reduce((s, p) => s + p.fixedProfit * p.quantity, 0); let html = '<div style="display:flex;flex-wrap:wrap;gap:12px;">'; if (cmp) { const totalP2 = selectedProducts.reduce((s, p) => s + p[t2] * p.quantity, 0); const totalPr = selectedProducts.reduce((s, p) => { if (p.type === 'package' && p.fixedProfit !== undefined) return s + p.fixedProfit * p.quantity; return s + Math.abs(p[t2] - p[t1]) * p.quantity; }, 0); const prRate = totalP1 > 0 ? (totalPr / totalP1) * 100 : 0; html += `<div class="summary-item"><h3>${t1} 價格</h3><div class="summary-row"><div>總數量:</div><div>${totalQty}</div></div><div class="summary-row total"><div>總金額:</div><div>${formatPrice(totalP1, false)}</div></div></div><div class="summary-item"><h3>${t2} 價格</h3><div class="summary-row"><div>總數量:</div><div>${totalQty}</div></div><div class="summary-row total"><div>總金額:</div><div>${formatPrice(totalP2, false)}</div></div></div><div class="summary-item"><h3>利潤計算</h3><div class="summary-row"><div>總利潤:</div><div class="profit">${formatProfit(totalPr)}</div></div><div class="summary-row"><div>利潤率:</div><div class="profit">${prRate.toFixed(2)}%</div></div><div class="summary-row"><div>平均單件:</div><div class="profit">${totalQty > 0 ? formatProfit(totalPr / totalQty) : formatProfit(0)}</div></div></div>`; if (pkgProds.length > 0) { html += `<div class="summary-item profit-section"><h3>💰 套裝固定利潤</h3>`; pkgProds.forEach(p => { html += `<div class="summary-row"><div>${p.prod_name}(* ${p.quantity}):</div><div class="profit">${formatProfit(p.fixedProfit * p.quantity)}</div></div>`; }); html += `<div class="summary-row total"><div>套裝利潤合計:</div><div class="profit">${formatProfit(totalPkgPr)}</div></div></div>`; } } else { html += `<div class="summary-item"><h3>${t1} 總計</h3><div class="summary-row"><div>總數量:</div><div>${totalQty}</div></div><div class="summary-row total"><div>總金額:</div><div>${formatPrice(totalP1, false)}</div></div></div>`; if (pkgProds.length > 0) { html += `<div class="summary-item profit-section"><h3>💰 套裝固定利潤</h3>`; pkgProds.forEach(p => { html += `<div class="summary-row"><div>${p.prod_name}(* ${p.quantity}):</div><div class="profit">${formatProfit(p.fixedProfit * p.quantity)}</div></div>`; }); html += `<div class="summary-row total"><div>套裝利潤合計:</div><div class="profit">${formatProfit(totalPkgPr)}</div></div></div>`; } } html += `<div class="summary-item"><h3>VP計算</h3><div class="summary-row"><div>總VP:</div><div>${totalVP.toFixed(2)}</div></div><div class="summary-row"><div>平均VP:</div><div>${totalQty > 0 ? (totalVP / totalQty).toFixed(2) : '0.00'}</div></div></div>`; html += '</div>'; sc.innerHTML = html; }

function selectStrategy(el) { document.querySelectorAll('.vp-strategy-opt').forEach(e => e.classList.remove('active')); el.classList.add('active'); currentStrategy = el.dataset.strategy; triggerHaptic('light'); }

function initVpWorker() {
  const workerCode = `
    self.onmessage = function(e) {
      const { targetVP, candidates, strategy } = e.data;
      let validCandidates = candidates.filter(p => p.vp > 0);
      validCandidates.forEach(p => p.cp = p.vp / p.price);
      validCandidates.sort((a, b) => b.cp - a.cp);
      let bestPrice = Infinity;
      let bestResults = [];
      let gVP = 0, gPrice = 0, gItems = [];
      for(let p of validCandidates) {
        while(gVP < targetVP) {
          gVP += p.vp; gPrice += p.price; gItems.push(p);
        }
        if(gVP >= targetVP) break;
      }
      if(gVP >= targetVP) {
        bestPrice = gPrice;
        bestResults.push({ items: gItems, totalVP: gVP, totalPrice: gPrice, qty: gItems.length, diff: gVP - targetVP });
      }
      function dfs(index, currentItems, currentVP, currentPrice, totalQty) {
        if (currentPrice > bestPrice && strategy !== 'fewest') return;
        if (totalQty > 20) return;
        if (currentVP >= targetVP) {
          const diff = currentVP - targetVP;
          if (currentPrice < bestPrice && strategy !== 'fewest') bestPrice = currentPrice;
          bestResults.push({ items: [...currentItems], totalVP: currentVP, totalPrice: currentPrice, qty: totalQty, diff: diff });
          return;
        }
        for (let i = index; i < validCandidates.length; i++) {
          const p = validCandidates[i];
          let maxQty = Math.ceil((targetVP - currentVP) / p.vp) + 1;
          for(let q = 1; q <= maxQty; q++) {
            let newPrice = currentPrice + p.price * q;
            if (newPrice > bestPrice && strategy !== 'fewest') break;
            let newItems = [...currentItems];
            for(let k = 0; k < q; k++) newItems.push(p);
            dfs(i + 1, newItems, currentVP + p.vp * q, newPrice, totalQty + q);
          }
        }
      }
      dfs(0, [], 0, 0, 0);
      if (strategy === 'accurate') {
        bestResults.sort((a, b) => a.diff - b.diff || a.totalPrice - b.totalPrice);
      } else if (strategy === 'cheapest') {
        bestResults.sort((a, b) => a.totalPrice - b.totalPrice || a.diff - b.diff);
      } else if (strategy === 'fewest') {
        bestResults.sort((a, b) => a.qty - b.qty || a.diff - b.diff);
      }
      const uniqueResults = [];
      const seen = new Set();
      for (const r of bestResults) {
        const sig = r.items.map(p => p.stock_no).sort().join(',');
        if (!seen.has(sig)) {
          seen.add(sig);
          uniqueResults.push(r);
        }
        if (uniqueResults.length >= 5) break;
      }
      self.postMessage(uniqueResults);
    };
  `;
  const blob = new Blob([workerCode], { type: 'application/javascript' });
  vpWorker = new Worker(URL.createObjectURL(blob));
  vpWorker.onmessage = function(e) {
    renderVpResults(e.data);
  };
}

function calculateVpRecommendations() {
  const targetVP = parseFloat(document.getElementById('target-vp-input').value);
  if (isNaN(targetVP) || targetVP <= 0) { showToast('請輸入有效的 VP 分數'); return; }
  if (candidateStockNos.size === 0) { showToast('請先在搜尋頁面用 🔖 選擇候選產品'); return; }
  const t1 = document.getElementById('pricing-tier1').value;
  const container = document.getElementById('vp-assistant-results');
  container.innerHTML = '<div class="vp-loading"><div class="spinner"></div>計算中，請稍候...</div>';
  let candidates = productsData.filter(p => candidateStockNos.has(p.stock_no));
  let simpleCandidates = candidates.map(p => ({ stock_no: p.stock_no, prod_name: p.prod_name, vp: p.vp, price: p[t1] }));
  if (vpWorker) {
    vpWorker.postMessage({ targetVP, candidates: simpleCandidates, strategy: currentStrategy });
  }
}

function renderVpResults(results) {
  const container = document.getElementById('vp-assistant-results');
  if (results.length === 0) {
    container.innerHTML = '<div style="text-align:center; color:var(--text-muted);">找不到符合的組合，請增加候選產品。</div>';
    return;
  }
  let html = '';
  results.forEach((r, idx) => {
    const itemMap = {};
    r.items.forEach(p => {
      if (!itemMap[p.stock_no]) itemMap[p.stock_no] = { ...p, count: 0 };
      itemMap[p.stock_no].count++;
    });
    const itemsHtml = Object.values(itemMap).map(p => `${p.prod_name} <span style="color:var(--text-muted); font-size:0.8em;">(x${p.count})</span>`).join(' + ');
    html += `<div class="vp-result-card"><div class="vp-result-header"><strong style="color: var(--text-heading);">方案 ${idx + 1}</strong><span style="color: var(--color-profit); font-weight: 800; font-size: 0.9rem;">總 VP: ${r.totalVP.toFixed(2)} (+${r.diff.toFixed(2)})</span></div><div class="vp-result-items">${itemsHtml}</div><div style="display:flex; justify-content:space-between; align-items:center; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;"><span>件數: ${r.qty}</span><span>金額: ${formatPrice(r.totalPrice, false)}</span></div><button class="btn-primary" style="width:100%; padding: 6px; font-size: 0.85rem; border-radius: 8px;" onclick='addRecommendationToCart(${JSON.stringify(Object.values(itemMap).map(p => ({stock_no: p.stock_no, qty: p.count})))})'>加入購物車</button></div>`;
  });
  container.innerHTML = html;
}

function addRecommendationToCart(items) {
  triggerHaptic('success');
  items.forEach(item => {
    const product = productsData.find(p => p.stock_no === item.stock_no);
    if (product) {
      const existing = selectedProducts.find(p => p.stock_no === item.stock_no);
      if (existing) existing.quantity += item.qty;
      else { selectedProducts.push({ ...product, quantity: item.qty }); newlyAddedStockNos.add(item.stock_no); }
    }
  });
  updateProductDisplay();
  closeVpAssistantModal();
  showToast('✅ 已將推薦組合加入購物車');
  setTimeout(() => newlyAddedStockNos.clear(), 400);
}
