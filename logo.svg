<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#082f49;stop-opacity:1" />
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ade80;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- 科技分子網絡圖案 -->
  <g transform="translate(256, 200)" filter="url(#neonGlow)">
    <!-- 連接線 -->
    <line x1="0" y1="0" x2="0" y2="-70" stroke="#22d3ee" stroke-width="4" opacity="0.8"/>
    <line x1="0" y1="0" x2="60" y2="35" stroke="#4ade80" stroke-width="4" opacity="0.8"/>
    <line x1="0" y1="0" x2="-60" y2="35" stroke="#22d3ee" stroke-width="4" opacity="0.8"/>
    <line x1="0" y1="-70" x2="60" y2="35" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
    <line x1="0" y1="-70" x2="-60" y2="35" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
    
    <!-- 節點 (圓點) -->
    <circle cx="0" cy="0" r="16" fill="#ffffff" />
    <circle cx="0" cy="-70" r="12" fill="#22d3ee" />
    <circle cx="60" cy="35" r="12" fill="#4ade80" />
    <circle cx="-60" cy="35" r="12" fill="#22d3ee" />
  </g>

  <!-- Herbalife 文字 -->
  <text x="256" y="415" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="72" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4" filter="url(#neonGlow)">Herbalife</text>
  
  <rect x="140" y="430" width="232" height="4" rx="2" fill="url(#textGrad)" opacity="0.8" filter="url(#neonGlow)"/>
</svg>