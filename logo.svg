<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Herbalife HBL Logo</title>
  <desc id="logoDesc">深藍漸變背景、青綠分子網絡圖案及清晰 Herbalife 文字</desc>
  <defs>
    <linearGradient id="background" x1="70" y1="45" x2="940" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10182f"/>
      <stop offset="0.48" stop-color="#181b49"/>
      <stop offset="1" stop-color="#07334a"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(512 380) rotate(90) scale(440)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="0.58" stop-color="#4f46e5" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="networkStroke" x1="305" y1="210" x2="730" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="185" y1="760" x2="842" y2="865" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9"/>
      <stop offset="0.48" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="nodeGlow" x="-120%" y="-120%" width="340%" height="340%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#0f172a"/>
  <rect x="18" y="18" width="988" height="988" rx="220" fill="url(#background)"/>
  <rect x="18" y="18" width="988" height="988" rx="220" fill="url(#ambient)"/>
  <rect x="30" y="30" width="964" height="964" rx="208" fill="none" stroke="#67e8f9" stroke-opacity="0.16" stroke-width="4"/>

  <circle cx="512" cy="390" r="276" fill="#22d3ee" opacity="0.07" filter="url(#softGlow)"/>
  <circle cx="512" cy="390" r="214" fill="none" stroke="#67e8f9" stroke-opacity="0.08" stroke-width="3"/>
  <circle cx="512" cy="390" r="166" fill="none" stroke="#86efac" stroke-opacity="0.07" stroke-width="3"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 384L512 228M512 384L665 474M512 384L359 474" stroke="#0b152b" stroke-opacity="0.65" stroke-width="28"/>
    <path d="M512 228L665 474M665 474L359 474M359 474L512 228" stroke="#0b152b" stroke-opacity="0.55" stroke-width="18"/>
    <path d="M512 384L512 228M512 384L665 474M512 384L359 474" stroke="url(#networkStroke)" stroke-width="15"/>
    <path d="M512 228L665 474M665 474L359 474M359 474L512 228" stroke="#e2e8f0" stroke-opacity="0.34" stroke-width="6"/>
  </g>

  <g filter="url(#nodeGlow)">
    <circle cx="512" cy="228" r="29" fill="#22d3ee"/>
    <circle cx="665" cy="474" r="29" fill="#4ade80"/>
    <circle cx="359" cy="474" r="29" fill="#22d3ee"/>
    <circle cx="512" cy="384" r="37" fill="#ffffff"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="5">
    <circle cx="512" cy="228" r="38"/>
    <circle cx="665" cy="474" r="38"/>
    <circle cx="359" cy="474" r="38"/>
  </g>
  <circle cx="512" cy="384" r="18" fill="#dffcff"/>

  <text x="512" y="816" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="122" font-weight="900" text-anchor="middle" letter-spacing="1" fill="#22d3ee" opacity="0.17" filter="url(#softGlow)">Herbalife</text>
  <text x="512" y="816" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="122" font-weight="900" text-anchor="middle" letter-spacing="1" fill="url(#wordmark)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" paint-order="stroke">Herbalife</text>
  <rect x="272" y="864" width="480" height="10" rx="5" fill="url(#wordmark)"/>
  <rect x="358" y="892" width="308" height="4" rx="2" fill="#e0f2fe" opacity="0.45"/>
</svg>
